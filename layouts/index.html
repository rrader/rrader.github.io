<!DOCTYPE html>
<html lang="en" data-theme="green">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Roman Rader // Quake Terminal</title>
  <meta name="description" content="Personal Web Terminal of Roman Rader - Cybersecurity Researcher & AI Educator in Kyiv, Ukraine." />

  {{ with .Site.Params.googleAnalytics | default "G-8H1V8F8PHP" }}
  <script async src="https://www.googletagmanager.com/gtag/js?id={{ . }}"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', '{{ . }}', { 'anonymize_ip': false });
  </script>
  {{ end }}

  <link rel="stylesheet" href="css/quake-terminal.css" />
</head>
<body>
  <div class="crt-wrapper">
    <div class="crt-scanlines"></div>
    <div class="crt-glow"></div>
    <canvas id="matrix-canvas"></canvas>

    <!-- Top Header Bar -->
    <header class="header-bar">
      <div class="header-title">
        <span class="quake-logo">⚡</span>
        <span>rmn.pp.ua</span>
      </div>
      <div class="header-controls">
        <button id="sfx-btn" class="ctrl-btn active" title="Toggle Sound Effects">🔊 SFX: ON</button>
        <button id="gfx-btn" class="ctrl-btn active" title="Toggle CRT Scanline Effects">📺 GFX: ON</button>
      </div>
    </header>

    <!-- Terminal Main Body -->
    <main class="terminal-container">
      <div id="terminal-output" class="terminal-output"></div>

      <!-- Quick Action Buttons -->
      <div class="quick-pills">
        <button class="pill-btn" data-cmd="bio">bio</button>
        <button class="pill-btn" data-cmd="research">research</button>
        <button class="pill-btn" data-cmd="teaching">teaching</button>
        <button class="pill-btn" data-cmd="contact">contact</button>
        <button class="pill-btn" data-cmd="help">help</button>
        <button class="pill-btn" data-cmd="clear">clear</button>
      </div>

      <!-- Interactive Prompt Line -->
      <div class="input-line">
        <span class="prompt-symbol">[guest@rmn.pp.ua ~]$</span>
        <div class="cmd-input-wrapper">
          <input type="text" id="cmd-input" class="cmd-input" autocomplete="off" spellcheck="false" autofocus placeholder="type command..." />
        </div>
      </div>
    </main>
  </div>

  <script src="js/quake-terminal.js"></script>
</body>
</html>
