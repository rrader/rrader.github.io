{{- if .IsTranslated -}}
<div class="translations-badge">
    <span style="color: var(--paper-accent); font-weight: 600;">🌐 {{ if eq .Language.Lang "uk" }}Інші мови:{{ else }}Other languages:{{ end }}</span>
    {{- range .Translations -}}
        <a href="{{ .RelPermalink }}" style="color: var(--paper-link); font-weight: 600; text-decoration: underline;">
            {{- if eq .Language.Lang "en" }}🇬🇧 English{{ else if eq .Language.Lang "uk" }}🇺🇦 Українська{{ else }}{{ .Language.LanguageName }}{{ end -}}
        </a>
    {{- end -}}
</div>
{{- end -}}
