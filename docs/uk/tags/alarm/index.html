  <script>
    (function() {
      const pwrBtn = document.getElementById('monitor-power-btn');
      const pwrLed = document.getElementById('monitor-power-led');
      const crtWrap = document.getElementById('crt-wrapper');
      const readingCont = document.querySelector('.doc-reading-container');
      let pwrOn = true;

      if (pwrBtn && crtWrap) {
        pwrBtn.addEventListener('click', function() {
          pwrOn = !pwrOn;
          if (pwrOn) {
            crtWrap.classList.remove('crt-powered-off');
            if (pwrLed) pwrLed.classList.remove('standby');
          } else {
            crtWrap.classList.add('crt-powered-off');
            if (pwrLed) pwrLed.classList.add('standby');
          }
        });
      }

      const osd1 = document.getElementById('osd-btn-1');
      if (osd1 && readingCont) {
        osd1.addEventListener('click', function() {
          readingCont.scrollTo({ top: 0, behavior: 'smooth' });
        });
      }

      const osd2 = document.getElementById('osd-btn-2');
      if (osd2) {
        osd2.addEventListener('click', function() {
          window.location.href = '\/uk\/';
        });
      }

      const osdDown = document.getElementById('osd-btn-down');
      if (osdDown && readingCont) {
        osdDown.addEventListener('click', function() {
          readingCont.scrollBy({ top: 350, behavior: 'smooth' });
        });
      }

      const osdUp = document.getElementById('osd-btn-up');
      if (osdUp && readingCont) {
        osdUp.addEventListener('click', function() {
          readingCont.scrollBy({ top: -350, behavior: 'smooth' });
        });
      }

      const topBtn = document.getElementById('doc-btn-top');
      if (topBtn && readingCont) {
        topBtn.addEventListener('click', function(e) {
          e.preventDefault();
          readingCont.scrollTo({ top: 0, behavior: 'smooth' });
        });
      }
    })();
  </script>
